<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysMath Vault — Ultimate Equation & Formula Engine</title>

    <!-- KaTeX CSS & JS for Lightning-Fast LaTeX Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
            onload="renderMathInElement(document.body);"></script>

    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(59, 130, 246, 0.4);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;

            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.07) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Header Layout */
        header {
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 2rem;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5krem;
            flex-wrap: wrap;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: #fff;
            text-decoration: none;
        }

        .brand-logo i {
            color: var(--accent-cyan);
        }

        .search-group {
            flex: 1;
            max-width: 500px;
            display: flex;
            position: relative;
        }

        .search-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 9999px 0 0 9999px;
            padding: 0.6rem 1rem 0.6rem 2.75rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-btn {
            background: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 0 9999px 9999px 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.15s ease;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        .stat-badges {
            display: flex;
            gap: 1rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge span {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* Tabs Navigation Bar */
        .tabs-nav-container {
            background: rgba(17, 24, 39, 0.5);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 2rem;
            position: sticky;
            top: 73px;
            z-index: 40;
            backdrop-filter: blur(8px);
            overflow-x: auto;
        }

        .tabs-list {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 0.5rem;
            list-style: none;
            white-space: nowrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .tab-btn .count {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
        }

        /* Workspace Grid Container */
        .workspace {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            flex: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .eq-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .eq-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .eq-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .eq-cat {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .card-actions {
            display: flex;
            gap: 0.4rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-btn.bookmarked {
            color: var(--accent-amber);
        }

        .math-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            overflow-x: auto;
        }

        .eq-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Interactive Solver Section */
        .solver-box {
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            padding-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .solver-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .solver-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .input-group label {
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: var(--accent-cyan);
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .calc-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .calc-btn:hover {
            background: #2563eb;
        }

        .calc-result {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.08);
            border: 1px dashed rgba(6, 182, 212, 0.3);
            padding: 0.4rem;
            border-radius: 6px;
            text-align: center;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent-blue);
            color: #fff;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Header Engine Navigation -->
    <header>
        <div class="header-container">
            <a href="#" class="brand-logo">
                <i data-lucide="atom"></i>
                PhysMath Vault
            </a>

            <div class="search-group">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search equations by name, symbol, or term...">
                <button class="search-btn" id="searchBtn">Search</button>
            </div>

            <div class="stat-badges">
                <div class="badge">
                    <i data-lucide="layers" style="width: 14px; height: 14px;"></i>
                    Formulas: <span id="totalFormulas">0</span>
                </div>
                <div class="badge">
                    <i data-lucide="bookmark" style="width: 14px; height: 14px;"></i>
                    Saved: <span id="savedCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Category Tabs Navigation Bar -->
    <nav class="tabs-nav-container">
        <ul class="tabs-list" id="tabsList">
            <!-- Dynamically Rendered Tabs -->
        </ul>
    </nav>

    <!-- Main Workspace -->
    <main class="workspace">
        <div class="grid-container" id="equationGrid">
            <!-- Dynamically Rendered Cards -->
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast">LaTeX Copied to Clipboard!</div>

    <script>
        // Comprehensive Multi-Disciplinary Equation Dataset (Math, Physics, Geometry, Calculus, Stats, Mechanics)
        const equations = [
            // --- MECHANICS ---
            {
                id: 'newton-second',
                title: "Newton's Second Law",
                category: 'Mechanics',
                latex: 'F = m \\cdot a',
                desc: 'Relates force, mass, and acceleration for an object.',
                solver: {
                    inputs: [
                        { name: 'm', label: 'Mass (kg)', default: 10 },
                        { name: 'a', label: 'Accel (m/s²)', default: 9.8 }
                    ],
                    calc: (v) => `Force = ${(v.m * v.a).toFixed(2)} N`
                }
            },
            {
                id: 'kinetic-energy',
                title: 'Kinetic Energy',
                category: 'Mechanics',
                latex: 'E_k = \\frac{1}{2} m v^2',
                desc: 'Energy possessed by an object due to its motion.',
                solver: {
                    inputs: [
                        { name: 'm', label: 'Mass (kg)', default: 2 },
                        { name: 'v', label: 'Velocity (m/s)', default: 5 }
                    ],
                    calc: `E_k = ${(0.5 * v.m * v.v**2).toFixed(2)} J`
                }
            },
            {
                id: 'potential-energy',
                title: 'Gravitational Potential Energy',
                category: 'Mechanics',
                latex: 'U = m g h',
                desc: 'Energy stored due to an object\'s position in a gravitational field.',
                solver: {
                    inputs: [
                        { name: 'm', label: 'Mass (kg)', default: 5 },
                        { name: 'h', label: 'Height (m)', default: 10 }
                    ],
                    calc: `U = ${(v.m * 9.80665 * v.h).toFixed(2)} J`
                }
            },
            {
                id: 'momentum',
                title: 'Linear Momentum',
                category: 'Mechanics',
                latex: 'p = m \\cdot v',
                desc: 'Product of the mass and velocity of an object.'
            },
            {
                id: 'work-energy',
                title: 'Mechanical Work',
                category: 'Mechanics',
                latex: 'W = F \\cdot d \\cos(\\theta)',
                desc: 'Energy transferred by a force acting over a displacement.'
            },

            // --- GEOMETRY & TRIGONOMETRY ---
            {
                id: 'pythagorean',
                title: 'Pythagorean Theorem',
                category: 'Geometry',
                latex: 'a^2 + b^2 = c^2',
                desc: 'Relates side lengths of a right triangle.',
                solver: {
                    inputs: [
                        { name: 'a', label: 'Leg a', default: 3 },
                        { name: 'b', label: 'Leg b', default: 4 }
                    ],
                    calc: `Hypotenuse c = ${Math.sqrt(v.a**2 + v.b**2).toFixed(3)}`
                }
            },
            {
                id: 'circle-area',
                title: 'Area of a Circle',
                category: 'Geometry',
                latex: 'A = \\pi r^2',
                desc: 'Calculates area enclosed by a circle.',
                solver: {
                    inputs: [{ name: 'r', label: 'Radius r', default: 5 }],
                    calc: `Area = ${(Math.PI * v.r**2).toFixed(3)}`
                }
            },
            {
                id: 'sphere-volume',
                title: 'Volume of a Sphere',
                category: 'Geometry',
                latex: 'V = \\frac{4}{3} \\pi r^3',
                desc: '3D spatial volume of a sphere.',
                solver: {
                    inputs: [{ name: 'r', label: 'Radius r', default: 3 }],
                    calc: `Volume = ${((4/3) * Math.PI * v.r**3).toFixed(3)}`
                }
            },
            {
                id: 'triangle-area',
                title: 'Area of a Triangle',
                category: 'Geometry',
                latex: 'A = \\frac{1}{2} b h',
                desc: 'Standard base and height triangle area formula.'
            },
            {
                id: 'trig-identity',
                title: 'Pythagorean Trigonometric Identity',
                category: 'Geometry',
                latex: '\\sin^2(\\theta) + \\cos^2(\\theta) = 1',
                desc: 'Fundamental identity relating sine and cosine.'
            },

            // --- CALCULUS & ANALYSIS ---
            {
                id: 'derivative-def',
                title: 'Limit Definition of Derivative',
                category: 'Calculus',
                latex: "f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}",
                desc: 'Instantaneous rate of change of a function.'
            },
            {
                id: 'integration-parts',
                title: 'Integration by Parts',
                category: 'Calculus',
                latex: '\\int u \\, dv = uv - \\int v \\, du',
                desc: 'Technique for simplifying integral evaluations.'
            },
            {
                id: 'fundamental-theorem',
                title: 'Fundamental Theorem of Calculus',
                category: 'Calculus',
                latex: '\\int_{a}^{b} f(x) \\, dx = F(b) - F(a)',
                desc: 'Connects differentiation and integration operations.'
            },
            {
                id: 'taylor-series',
                title: 'Taylor Series Expansion',
                category: 'Calculus',
                latex: 'f(x) = \\sum_{n=0}^{\\infty} \\frac{f^{(n)}(a)}{n!} (x - a)^n',
                desc: 'Approximates functions as infinite polynomial sums.'
            },

            // --- THERMODYNAMICS ---
            {
                id: 'ideal-gas',
                title: 'Ideal Gas Law',
                category: 'Thermodynamics',
                latex: 'P V = n R T',
                desc: 'Relates pressure, volume, temperature, and moles of a gas.',
                solver: {
                    inputs: [
                        { name: 'n', label: 'Moles (n)', default: 1 },
                        { name: 'T', label: 'Temp (K)', default: 298.15 },
                        { name: 'V', label: 'Volume (m³)', default: 0.0224 }
                    ],
                    calc: `Pressure = ${((v.n * 8.31446 * v.T) / v.V).toFixed(1)} Pa`
                }
            },
            {
                id: 'entropy-boltzmann',
                title: 'Boltzmann Entropy',
                category: 'Thermodynamics',
                latex: 'S = k_B \\ln \\Omega',
                desc: 'Links macroscopic entropy to microstate count.'
            },
            {
                id: 'first-law-thermo',
                title: 'First Law of Thermodynamics',
                category: 'Thermodynamics',
                latex: '\\Delta U = Q - W',
                desc: 'Conservation of energy applied to thermodynamic systems.'
            },

            // --- ELECTROMAGNETISM ---
            {
                id: 'coulomb-law',
                title: "Coulomb's Law",
                category: 'Electromagnetism',
                latex: 'F = k_e \\frac{q_1 q_2}{r^2}',
                desc: 'Electrostatic force between two point charges.'
            },
            {
                id: 'ohm-law',
                title: "Ohm's Law",
                category: 'Electromagnetism',
                latex: 'V = I \\cdot R',
                desc: 'Relates voltage, current, and electrical resistance.',
                solver: {
                    inputs: [
                        { name: 'I', label: 'Current (A)', default: 2 },
                        { name: 'R', label: 'Resistance (Ω)', default: 50 }
                    ],
                    calc: `Voltage = ${(v.I * v.R).toFixed(2)} V`
                }
            },
            {
                id: 'maxwell-gauss',
                title: "Gauss's Law for Electricity",
                category: 'Electromagnetism',
                latex: '\\nabla \\cdot \\mathbf{E} = \\frac{\\rho}{\\varepsilon_0}',
                desc: 'Relates electric field divergence to electric charge density.'
            },

            // --- QUANTUM & RELATIVITY ---
            {
                id: 'mass-energy',
                title: 'Mass-Energy Equivalence',
                category: 'Relativity',
                latex: 'E = m c^2',
                desc: 'Einstein rest energy formula.',
                solver: {
                    inputs: [{ name: 'm', label: 'Mass (kg)', default: 1 }],
                    calc: `Energy = ${(v.m * (299792458)**2).toExponential(4)} J`
                }
            },
            {
                id: 'schrodinger',
                title: 'Schrödinger Equation',
                category: 'Quantum',
                latex: 'i\\hbar \\frac{\\partial}{\\partial t}\\Psi = \\hat{H}\\Psi',
                desc: 'Governs quantum wave function evolution.'
            },
            {
                id: 'planck-relation',
                title: 'Planck-Einstein Relation',
                category: 'Quantum',
                latex: 'E = h \\nu',
                desc: 'Photon energy proportional to frequency.'
            },

            // --- STATISTICS & PROBABILITY ---
            {
                id: 'normal-distribution',
                title: 'Normal Distribution Probability Density',
                category: 'Statistics',
                latex: 'f(x) = \\frac{1}{\\sigma \\sqrt{2\\pi}} e^{-\\frac{1}{2}\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}',
                desc: 'Gaussian continuous probability distribution formula.'
            },
            {
                id: 'bayes-theorem',
                title: "Bayes' Theorem",
                category: 'Statistics',
                latex: 'P(A|B) = \\frac{P(B|A) P(A)}{P(B)}',
                desc: 'Calculates conditional probability.'
            }
        ];

        // State Management
        let bookmarks = JSON.parse(localStorage.getItem('vault_bookmarks') || '[]');
        let activeTab = 'all';
        let searchQuery = '';

        // DOM Elements
        const gridEl = document.getElementById('equationGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const tabsListEl = document.getElementById('tabsList');
        const totalFormulasEl = document.getElementById('totalFormulas');
        const savedCountEl = document.getElementById('savedCount');
        const toast = document.getElementById('toast');

        // Categories list for tabs
        const categories = ['all', 'bookmarks', 'Mechanics', 'Geometry', 'Calculus', 'Thermodynamics', 'Electromagnetism', 'Relativity', 'Quantum', 'Statistics'];

        function renderTabs() {
            tabsListEl.innerHTML = '';
            categories.forEach(cat => {
                const count = cat === 'all' ? equations.length :
                              cat === 'bookmarks' ? bookmarks.length :
                              equations.filter(e => e.category === cat).length;

                const label = cat === 'all' ? 'All Disciplines' :
                              cat === 'bookmarks' ? 'Bookmarks' : cat;

                const btn = document.createElement('button');
                btn.className = `tab-btn ${activeTab === cat ? 'active' : ''}`;
                btn.innerHTML = `${label} <span class="count">${count}</span>`;
                btn.onclick = () => {
                    activeTab = cat;
                    renderVault();
                };
                tabsListEl.appendChild(btn);
            });
        }

        function renderVault() {
            renderTabs();
            gridEl.innerHTML = '';

            const filtered = equations.filter(eq => {
                const matchesTab = 
                    activeTab === 'all' ? true :
                    activeTab === 'bookmarks' ? bookmarks.includes(eq.id) :
                    eq.category === activeTab;

                const matchesSearch = 
                    eq.title.toLowerCase().includes(searchQuery) ||
                    eq.category.toLowerCase().includes(searchQuery) ||
                    eq.desc.toLowerCase().includes(searchQuery) ||
                    eq.latex.toLowerCase().includes(searchQuery);

                return matchesTab && matchesSearch;
            });

            if (filtered.length === 0) {
                gridEl.innerHTML = `<div class="no-results">No equations found matching your search criteria.</div>`;
                updateStats();
                return;
            }

            filtered.forEach(eq => {
                const isBookmarked = bookmarks.includes(eq.id);
                const card = document.createElement('div');
                card.className = 'eq-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="eq-title">${eq.title}</div>
                            <div class="eq-cat">${eq.category}</div>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${eq.id}')" title="Bookmark">
                                <i data-lucide="bookmark" style="width: 18px; height: 18px;"></i>
                            </button>
                            <button class="icon-btn" onclick="copyLatex(\`${escapeLatex(eq.latex)}\`)" title="Copy LaTeX">
                                <i data-lucide="copy" style="width: 18px; height: 18px;"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="math-display">
                        \\[ ${eq.latex} \\]
                    </div>
                    
                    <p class="eq-desc">${eq.desc}</p>
                    
                    ${eq.solver ? renderSolverHTML(eq) : ''}
                `;
                gridEl.appendChild(card);
            });

            updateStats();
            lucide.createIcons();
            
            if (window.renderMathInElement) {
                renderMathInElement(gridEl);
            }
        }

        function escapeLatex(latexStr) {
            return latexStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function renderSolverHTML(eq) {
            const inputsHTML = eq.solver.inputs.map(ip => `
                <div class="input-group">
                    <label>${ip.label}</label>
                    <input type="number" step="any" id="input-${eq.id}-${ip.name}" value="${ip.default}">
                </div>
            `).join('');

            return `
                <div class="solver-box">
                    <div class="solver-title">Interactive Calculator</div>
                    <div class="solver-inputs">${inputsHTML}</div>
                    <button class="calc-btn" onclick="runSolver('${eq.id}')">Calculate</button>
                    <div class="calc-result" id="result-${eq.id}">Result will appear here</div>
                </div>
            `;
        }

        window.runSolver = function(eqId) {
            const eq = equations.find(e => e.id === eqId);
            if (!eq || !eq.solver) return;

            const v = {};
            eq.solver.inputs.forEach(ip => {
                const el = document.getElementById(`input-${eq.id}-${ip.name}`);
                v[ip.name] = parseFloat(el.value) || 0;
            });

            const res = typeof eq.solver.calc === 'function' ? eq.solver.calc(v) : eq.solver.calc;
            document.getElementById(`result-${eq.id}`).innerText = res;
        };

        window.toggleBookmark = function(id) {
            if (bookmarks.includes(id)) {
                bookmarks = bookmarks.filter(bId => bId !== id);
            } else {
                bookmarks.push(id);
            }
            localStorage.setItem('vault_bookmarks', JSON.stringify(bookmarks));
            renderVault();
        };

        window.copyLatex = function(latexText) {
            navigator.clipboard.writeText(latexText).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        };

        function updateStats() {
            totalFormulasEl.innerText = equations.length;
            savedCountEl.innerText = bookmarks.length;
        }

        // Search Handlers
        function executeSearch() {
            searchQuery = searchInput.value.toLowerCase().trim();
            renderVault();
        }

        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') executeSearch();
            searchQuery = searchInput.value.toLowerCase().trim();
            renderVault();
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            renderVault();
        });
    </script>
</body>
</html>
